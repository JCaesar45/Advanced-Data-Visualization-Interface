<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced Data Visualization Interface</title>
    <style>
      :root {
        --bg-primary: #0a0a0f;
        --bg-secondary: #12121a;
        --accent-primary: #00f0ff;
        --accent-secondary: #7000ff;
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0a0;
        --error: #ff2a6d;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "SF Pro Display",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
      }
      header {
        padding: 1.5rem 2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 100;
      }
      main {
        padding: 2rem;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      .card {
        background: var(--bg-secondary);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 1.5rem;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 30px rgba(0, 240, 255, 0.05);
      }
      .metric-value {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--accent-primary),
          var(--accent-secondary)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0.5rem 0;
      }
      .status-indicator {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: #00ff9d;
        margin-right: 8px;
        box-shadow: 0 0 8px #00ff9d;
      }
      canvas {
        width: 100%;
        height: 200px;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>System Telemetry Dashboard</h1>
      <p style="color: var(--text-secondary); margin-top: 0.5rem">
        <span class="status-indicator"></span>
        Operational | Latency:
        <span id="latency">12</span>
        ms
      </p>
    </header>
    <main>
      <div class="card">
        <h3>Throughput</h3>
        <div class="metric-value" id="throughput">0</div>
        <p style="color: var(--text-secondary)">Requests per second</p>
        <canvas id="throughputChart"></canvas>
      </div>
      <div class="card">
        <h3>Error Rate</h3>
        <div class="metric-value" id="errorRate">0.00%</div>
        <p style="color: var(--text-secondary)">Global failure index</p>
      </div>
      <div class="card">
        <h3>Active Connections</h3>
        <div class="metric-value" id="connections">0</div>
        <p style="color: var(--text-secondary)">Concurrent websockets</p>
      </div>
    </main>
    <script>
      class TelemetryEngine {
        constructor() {
          this.throughputData = new Array(30).fill(0);
          this.init();
        }
        init() {
          this.bindEvents();
          this.startSimulation();
          this.renderChart();
        }
        bindEvents() {
          document.addEventListener("visibilitychange", () => {
            if (document.hidden) this.pause();
            else this.resume();
          });
        }
        startSimulation() {
          this.interval = setInterval(() => {
            const newThroughput = Math.floor(Math.random() * 500) + 1000;
            const newConnections = Math.floor(Math.random() * 200) + 800;
            this.updateDOM(newThroughput, newConnections);
            this.updateChart(newThroughput);
          }, 1000);
        }
        updateDOM(throughput, connections) {
          document.getElementById("throughput").textContent =
            throughput.toLocaleString();
          document.getElementById("connections").textContent =
            connections.toLocaleString();
          document.getElementById("latency").textContent =
            Math.floor(Math.random() * 15) + 8;
        }
        updateChart(value) {
          this.throughputData.shift();
          this.throughputData.push(value);
          this.renderChart();
        }
        renderChart() {
          const canvas = document.getElementById("throughputChart");
          const ctx = canvas.getContext("2d");
          canvas.width = canvas.offsetWidth;
          canvas.height = canvas.offsetHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.beginPath();
          ctx.strokeStyle = "#00f0ff";
          ctx.lineWidth = 2;
          const step = canvas.width / (this.throughputData.length - 1);
          const max = Math.max(...this.throughputData) * 1.2;
          this.throughputData.forEach((val, i) => {
            const x = i * step;
            const y = canvas.height - (val / max) * canvas.height;
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          });
          ctx.stroke();
        }
        pause() {
          clearInterval(this.interval);
        }
        resume() {
          this.startSimulation();
        }
      }
      document.addEventListener(
        "DOMContentLoaded",
        () => new TelemetryEngine()
      );
    </script>
  </body>
</html>
